<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Planting calendar</h1>
  <div id="top-controls">
    <div id="frost-date-container">
      <label for="frost-date-input">Last Frost Date:</label>
      <input type="date" id="frost-date-input" />
    </div>    
    <div id="action-legend"></div>
    <!-- Right: Download buttons -->
    <div id="download-buttons" style="text-align: right;">
      <button id="download-pdf-btn">Download Calendar PDF</button>
      <button id="download-json-btn">Download JSON file</button>
      <button id="upload-json-btn">Upload JSON File</button>
      <input type="file" id="upload-json-input" accept=".json" style="display:none;">
    </div>
  </div>
  
  <div id="app-layout">
    <div id="calendar-container">
      <!-- Calendar will be dynamically generated here -->
    </div>
    
    <div id="selection-container">
      <h2>Select Plants to Display</h2>
      <div id="plant-options"></div>
      <button id="clear-selection-btn">Clear All Selections</button>
      <button id="restore-defaults-btn">Restore Default Plants</button>
    </div>
  </div>
  <div id="form-and-info-container">
    <form id="custom-plant-form">
      <h2>Add Custom Plant</h2>
      <label for="plant-name">Plant Name:</label>
      <input type="text" id="plant-name" required>
  
      <label for="sun-needs">Sun Needs:</label>
      <input type="text" id="sun-needs">
  
      <label for="water-needs">Water Needs:</label>
      <input type="text" id="water-needs">
  
      <label for="sow-indoor">Sow Indoors (weeks before frost, put in a negative number if sowing after frost):</label>
      <input type="number" id="sow-indoor">
  
      <label for="sow-outdoor">Sow Outdoors (weeks after frost):</label>
      <input type="number" id="sow-outdoor">
  
      <label for="transplant">Transplant (weeks after frost):</label>
      <input type="number" id="transplant">
<!--  removing this, there is no good way to tell when harvest happens
      <label for="harvest">Harvest (weeks after frost):</label>
      <input type="number" id="harvest">
  -->
      <label for="plant-alt-text">Icon (emoji or 3 characters):</label>
      <input type="text" id="plant-alt-text" maxlength="3" placeholder="🌱 or ABC">
  
      <button type="submit">Add Plant</button>
    </form>
    
    <div id="show-plant-info" class="plant-info-box" style="display:none;"></div>
  </div>
  
  <button id="clear-session-btn">Clear Session</button>
  User-generated plants are saved locally, in your browser. Clear session to remove local data. 
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
